# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Application Name
spring.application.name=repair-service-backend

# Primary MySQL Database Configuration (Client Portal)
spring.datasource.primary.url=jdbc:mysql://localhost:3306/repairapp_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.primary.username=root
spring.datasource.primary.password=${DB_PASSWORD}
spring.datasource.primary.driver-class-name=com.mysql.cj.jdbc.Driver

# Secondary MySQL Database Configuration (Admin Portal - Read Only)
spring.datasource.admin.url=jdbc:mysql://localhost:3306/digicashon_admin_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.admin.username=root
spring.datasource.admin.password=${DB_PASSWORD}
spring.datasource.admin.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration  
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=false
spring.jpa.open-in-view=false

# Force schema updates (temporary for debugging)
spring.jpa.properties.hibernate.hbm2ddl.auto=update
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.generate-ddl=true

# SQL Script Configuration
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# Flyway Configuration (temporarily disabled)
spring.flyway.enabled=false
# spring.flyway.baseline-on-migrate=true
# spring.flyway.validate-on-migrate=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.sql-migration-suffixes=.sql
# spring.flyway.clean-disabled=false

# Email (SMTP) Configuration
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.example.com}

# App Mail Config
app.mail.from=${MAIL_FROM:info@digicashon.com}
app.mail.admin=${MAIL_ADMIN:admin@example.com}

# 2Factor SMS OTP Config
app.sms.twofactor.apikey=${SMS_API_KEY:}
app.sms.twofactor.template=OTP1

# JWT Configuration
app.jwt.secret=${JWT_SECRET:mySecretKey12345678901234567890123456789012345678901234567890}
app.jwt.expiration=86400000
app.jwt.refresh-expiration=604800000

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}

# Logging Configuration
logging.level.com.repairapp=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.tool.schema=DEBUG
logging.level.org.hibernate.tool.hbm2ddl=DEBUG

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Development Settings
